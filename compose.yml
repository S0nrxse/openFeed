name: openfeed

networks:
  openfeed_net:
    driver: bridge

# Shared OPENFEED_* / sync / cache / concurrency settings so app and worker can't diverge.
x-openfeed-common-env: &openfeed-common-env
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-1800}
  ENRICH_AFTER_SYNC_LIMIT: ${ENRICH_AFTER_SYNC_LIMIT:-40}
  ENRICHMENT_TIMEOUT_SECONDS: ${ENRICHMENT_TIMEOUT_SECONDS:-12}
  DISCOVER_AFTER_SYNC_LIMIT: ${DISCOVER_AFTER_SYNC_LIMIT:-3}
  DISCOVER_RELATED_PER_VIDEO: ${DISCOVER_RELATED_PER_VIDEO:-6}
  INVIDIOUS_BASE_URL: ${INVIDIOUS_BASE_URL:-http://openfeed-invidious:3000}
  INVIDIOUS_PUBLIC_URL: ${INVIDIOUS_PUBLIC_URL:-http://localhost:8061}
  OPENFEED_PLAYBACK_FALLBACK: ${OPENFEED_PLAYBACK_FALLBACK:-off}
  OPENFEED_INVIDIOUS_FALLBACKS: ${OPENFEED_INVIDIOUS_FALLBACKS:-}
  OPENFEED_ALLOW_PUBLIC_INSTANCES: ${OPENFEED_ALLOW_PUBLIC_INSTANCES:-false}
  OPENFEED_OUTBOUND_PROXY: ${OPENFEED_OUTBOUND_PROXY:-}
  OPENFEED_LOG_CLIENT_DETAILS: ${OPENFEED_LOG_CLIENT_DETAILS:-false}
  OPENFEED_PLAYBACK_PROBE_TIMEOUT: ${OPENFEED_PLAYBACK_PROBE_TIMEOUT:-4}
  OPENFEED_YTDLP_ENABLED: ${OPENFEED_YTDLP_ENABLED:-true}
  OPENFEED_YTDLP_PLAYBACK: ${OPENFEED_YTDLP_PLAYBACK:-true}
  OPENFEED_YTDLP_TIMEOUT: ${OPENFEED_YTDLP_TIMEOUT:-90}
  OPENFEED_YTDLP_CACHE_SECONDS: ${OPENFEED_YTDLP_CACHE_SECONDS:-240}
  OPENFEED_YTDLP_COOKIES_FILE: ${OPENFEED_YTDLP_COOKIES_FILE:-}
  OPENFEED_YTDLP_EXTRA_ARGS: ${OPENFEED_YTDLP_EXTRA_ARGS:-}
  OPENFEED_DOWNLOAD_DIR: ${OPENFEED_DOWNLOAD_DIR:-/data/downloads}
  OPENFEED_DOWNLOAD_RETENTION: ${OPENFEED_DOWNLOAD_RETENTION:-21600}
  OPENFEED_DOWNLOAD_CONCURRENCY: ${OPENFEED_DOWNLOAD_CONCURRENCY:-2}
  OPENFEED_DOWNLOAD_MAX_HEIGHT: ${OPENFEED_DOWNLOAD_MAX_HEIGHT:-2160}
  OPENFEED_DEARROW_ENABLED: ${OPENFEED_DEARROW_ENABLED:-true}

services:
  openfeed-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfeed}
      POSTGRES_USER: ${POSTGRES_USER:-openfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ${OPENFEED_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfeed} -d ${POSTGRES_DB:-openfeed}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openfeed_net

  openfeed-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${OPENFEED_DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openfeed_net

  openfeed-app:
    build:
      context: ./app
    image: ${OPENFEED_IMAGE:-openfeed-app:local}
    restart: unless-stopped
    # Match the uid of the bind-mounted ./data/downloads owner (set OPENFEED_UID
    # for host setups). The image's own openfeed user is uid 10000 otherwise.
    user: "${OPENFEED_UID:-10000}:${OPENFEED_GID:-10000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A runaway 4K remux or a fork bomb inside the container should not be able to
    # starve the database on the shared host.
    mem_limit: ${OPENFEED_APP_MEM_LIMIT:-4g}
    pids_limit: ${OPENFEED_APP_PIDS_LIMIT:-256}
    depends_on:
      openfeed-postgres:
        condition: service_healthy
      openfeed-redis:
        condition: service_healthy
      openfeed-invidious:
        condition: service_started
    # Further OIDC providers' settings (OPENFEED_OIDC_<NAME>_*, docs/accounts.md).
    env_file:
      - path: ./signin.env
        required: false
    environment:
      <<: *openfeed-common-env
      TZ: ${TZ:-UTC}
      OPENFEED_PUBLIC_URL: ${OPENFEED_PUBLIC_URL:-http://localhost:8060}
      OPENFEED_SOURCE_URL: ${OPENFEED_SOURCE_URL:-https://github.com/S0nrxse/openFeed}
      OPENFEED_SECRET_KEY: ${OPENFEED_SECRET_KEY:?set OPENFEED_SECRET_KEY in .env}
      OPENFEED_AUTH_MODE: ${OPENFEED_AUTH_MODE:-disabled}
      OPENFEED_REQUIRE_LOGIN: ${OPENFEED_REQUIRE_LOGIN:-false}
      OPENFEED_REQUIRED_GROUP: ${OPENFEED_REQUIRED_GROUP:-}
      OPENFEED_ADMIN_GROUPS: ${OPENFEED_ADMIN_GROUPS:-}
      OPENFEED_SESSION_SECRET: ${OPENFEED_SESSION_SECRET:-}
      OPENFEED_SESSION_COOKIE: ${OPENFEED_SESSION_COOKIE:-openfeed_session}
      OPENFEED_RSS_GUID_NAMESPACE: ${OPENFEED_RSS_GUID_NAMESPACE:-openfeed}
      OPENFEED_OIDC_ISSUER: ${OPENFEED_OIDC_ISSUER:-}
      OPENFEED_OIDC_DISCOVERY_URL: ${OPENFEED_OIDC_DISCOVERY_URL:-}
      OPENFEED_OIDC_BACKCHANNEL_BASE_URL: ${OPENFEED_OIDC_BACKCHANNEL_BASE_URL:-}
      OPENFEED_OIDC_CLIENT_ID: ${OPENFEED_OIDC_CLIENT_ID:-}
      OPENFEED_OIDC_CLIENT_SECRET: ${OPENFEED_OIDC_CLIENT_SECRET:-}
      OPENFEED_OIDC_REDIRECT_URI: ${OPENFEED_OIDC_REDIRECT_URI:-}
      OPENFEED_OIDC_SCOPE: ${OPENFEED_OIDC_SCOPE:-openid email profile}
      OPENFEED_OIDC_NAME: ${OPENFEED_OIDC_NAME:-Authentik}
      OPENFEED_PASSWORD_SIGNIN: ${OPENFEED_PASSWORD_SIGNIN:-auto}
      OPENFEED_TRUSTED_PROXIES: ${OPENFEED_TRUSTED_PROXIES:-}
      # Phase 2 sign-in methods (docs/accounts.md). Per-provider OPENFEED_OIDC_<NAME>_*
      # settings go in signin.env next to this file (read by env_file above, if it exists).
      OPENFEED_PASSKEYS: ${OPENFEED_PASSKEYS:-auto}
      OPENFEED_OIDC_PROVIDERS: ${OPENFEED_OIDC_PROVIDERS:-}
      OPENFEED_TRUSTED_HEADER: ${OPENFEED_TRUSTED_HEADER:-}
      OPENFEED_TRUSTED_HEADER_GROUPS: ${OPENFEED_TRUSTED_HEADER_GROUPS:-}
      OPENFEED_TRUSTED_HEADER_NAME: ${OPENFEED_TRUSTED_HEADER_NAME:-}
      OPENFEED_TRUSTED_HEADER_LABEL: ${OPENFEED_TRUSTED_HEADER_LABEL:-your sign-in proxy}
      OPENFEED_TRUSTED_HEADER_CREATE_ACCOUNTS: ${OPENFEED_TRUSTED_HEADER_CREATE_ACCOUNTS:-registration}
      OPENFEED_TRUSTED_HEADER_ADMIN_GROUPS: ${OPENFEED_TRUSTED_HEADER_ADMIN_GROUPS:-}
      OPENFEED_TRUSTED_HEADER_LOGOUT_URL: ${OPENFEED_TRUSTED_HEADER_LOGOUT_URL:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-openfeed}:${POSTGRES_PASSWORD}@openfeed-postgres:5432/${POSTGRES_DB:-openfeed}
      REDIS_URL: ${REDIS_URL:-redis://openfeed-redis:6379/0}
    ports:
      - "${OPENFEED_BIND_IP:-127.0.0.1}:${OPENFEED_PORT:-8060}:8000"
    volumes:
      # Downloads kept on the server are a library, so they live on a bind mount rather
      # than inside the container where a rebuild would wipe them.
      - ${OPENFEED_DATA_DIR:-./data}/downloads:/data/downloads
    healthcheck:
      test: ["CMD", "python", "-m", "openfeed.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - openfeed_net

  openfeed-worker:
    image: ${OPENFEED_IMAGE:-openfeed-app:local}
    restart: unless-stopped
    stop_signal: SIGINT
    profiles: ["worker"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OPENFEED_WORKER_MEM_LIMIT:-1g}
    pids_limit: ${OPENFEED_WORKER_PIDS_LIMIT:-128}
    depends_on:
      openfeed-postgres:
        condition: service_healthy
      openfeed-redis:
        condition: service_healthy
    command: ["python", "-m", "openfeed.worker"]
    environment:
      <<: *openfeed-common-env
      TZ: ${TZ:-UTC}
      OPENFEED_PUBLIC_URL: ${OPENFEED_PUBLIC_URL:-http://localhost:8060}
      OPENFEED_SOURCE_URL: ${OPENFEED_SOURCE_URL:-https://github.com/S0nrxse/openFeed}
      OPENFEED_SECRET_KEY: ${OPENFEED_SECRET_KEY:?set OPENFEED_SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-openfeed}:${POSTGRES_PASSWORD}@openfeed-postgres:5432/${POSTGRES_DB:-openfeed}
      REDIS_URL: ${REDIS_URL:-redis://openfeed-redis:6379/0}
    networks:
      - openfeed_net

  openfeed-invidious-db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INVIDIOUS_DB_NAME:-invidious}
      POSTGRES_USER: ${INVIDIOUS_DB_USER:-invidious}
      POSTGRES_PASSWORD: ${INVIDIOUS_DB_PASSWORD:?set INVIDIOUS_DB_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ${OPENFEED_DATA_DIR:-./data}/invidious-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVIDIOUS_DB_USER:-invidious} -d ${INVIDIOUS_DB_NAME:-invidious}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openfeed_net

  openfeed-invidious:
    image: quay.io/invidious/invidious:2.20261103.0
    restart: unless-stopped
    depends_on:
      openfeed-invidious-db:
        condition: service_healthy
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: ${INVIDIOUS_DB_NAME:-invidious}
          user: ${INVIDIOUS_DB_USER:-invidious}
          password: ${INVIDIOUS_DB_PASSWORD}
          host: openfeed-invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://openfeed-invidious-companion:8282/companion"
        invidious_companion_key: ${INVIDIOUS_COMPANION_KEY:?set INVIDIOUS_COMPANION_KEY in .env}
        hmac_key: ${INVIDIOUS_HMAC_KEY:?set INVIDIOUS_HMAC_KEY in .env}
        domain: ${INVIDIOUS_DOMAIN:-localhost}
        external_port: ${INVIDIOUS_PORT:-8061}
        https_only: false
        statistics_enabled: false
        popular_enabled: true
        registration_enabled: false
    ports:
      - "${INVIDIOUS_BIND_IP:-127.0.0.1}:${INVIDIOUS_PORT:-8061}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - openfeed_net

  openfeed-invidious-companion:
    image: quay.io/invidious/invidious-companion:2026.11.07-07ae73c
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${INVIDIOUS_COMPANION_KEY:?set INVIDIOUS_COMPANION_KEY in .env}
      # YouTube intermittently answers player requests with no stream URLs. Retrying with
      # backoff turns most of those into a hit instead of a 404 on the video page.
      NETWORKING_FETCH_RETRY_ENABLED: ${COMPANION_RETRY_ENABLED:-true}
      NETWORKING_FETCH_RETRY_TIMES: ${COMPANION_RETRY_TIMES:-3}
      NETWORKING_FETCH_RETRY_INITIAL_DEBOUNCE: ${COMPANION_RETRY_DEBOUNCE_MS:-500}
      NETWORKING_FETCH_RETRY_DEBOUNCE_MULTIPLIER: ${COMPANION_RETRY_MULTIPLIER:-2}
      # Leave UMP off: with it on, /videoplayback answers application/vnd.yt-ump with an
      # empty body and video.js reports "media could not be loaded / format not supported".
      NETWORKING_VIDEOPLAYBACK_UMP: ${COMPANION_UMP:-false}
      # Left at the 5 minute default on purpose: hammering attestation from an IP
      # YouTube already distrusts makes the block worse, not better.
      JOBS_YOUTUBE_SESSION_FREQUENCY: ${COMPANION_SESSION_FREQUENCY:-*/5 * * * *}
      # Optional: a YouTube cookie header restores formats when attestation alone fails.
      # Set COMPANION_YOUTUBE_COOKIES in .env — never commit it.
      YOUTUBE_SESSION_COOKIES: ${COMPANION_YOUTUBE_COOKIES:-}
      # Optional: route YouTube calls through a different egress IP.
      PROXY: ${COMPANION_PROXY:-}
    volumes:
      - ${OPENFEED_DATA_DIR:-./data}/invidious-companion-cache:/var/tmp/youtubei.js:rw
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - openfeed_net

  openfeed-qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    profiles: ["vectors"]
    volumes:
      - ${OPENFEED_DATA_DIR:-./data}/qdrant:/qdrant/storage
    networks:
      - openfeed_net

  openfeed-typesense:
    image: typesense/typesense:29.0
    restart: unless-stopped
    profiles: ["search"]
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-}", "--enable-cors"]
    volumes:
      - ${OPENFEED_DATA_DIR:-./data}/typesense:/data
    networks:
      - openfeed_net
